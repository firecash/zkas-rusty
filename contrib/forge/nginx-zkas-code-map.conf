# Short code links: zkas.info/code/<name> -> the Radicle repo on our seed.
map $code_name $code_repo {
    default          "";
    rusty            zkas-rusty;
    node             zkas-rusty;
    wallet           zkas-wallet;
    signer           zkas-signer;
    explorer         zkas-explorer;
    sdk              zkas-sdk;
    gateway          zkas-payment-gateway;
    website          zkas-website;
    blog             zkas-blog;
    paper-wallet     zkas-paper-wallet;
    vprogs           vprogs-zkas;
    bridge           solo-dual-mode;
    solo-dual-mode   solo-dual-mode;
}

# Short name -> Radicle repository id, for links to the public seeds (iris/rosa), which
