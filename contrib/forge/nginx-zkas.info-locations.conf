    # Wallet releases (no forge since Oct 2026). releases.json is the desktop app's
    # update feed, read from the WebView (tauri://localhost), so it needs CORS.
    location = /downloads/wallet/releases.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /downloads/ { try_files $uri $uri/index.html =404; }

    # Published shielded chain (zkas-walletd chain_files): immutable 12-hour segments plus a
    # short-lived manifest. Identical bytes for every wallet; a CDN can pull from here.
    # Retired: the 1.0.52-rc20 client re-downloaded segments in a loop with two wallets, and
    # it refetches a refused manifest on every page, so its manifest name answers a bare 404
    # (it then reads from the node). rc21+ read manifest-v2.json.
    # Shielded chain gateway (zkas-chain-gateway.service on 127.0.0.1:16190): the node's public
    # shielded reads over HTTPS for wallets running in a browser (no gRPC in a web page).
    location /chain-gateway/ {
        proxy_pass http://127.0.0.1:16190/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location = /shielded-chain/manifest.json {
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        return 404;
    }
    location = /shielded-chain/manifest-v2.json {
        add_header Cache-Control "public, max-age=60" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    location /shielded-chain/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Source code on Radicle (GitHub and GitLab both suspended the account, Oct 2026).
    # /code -> repo list; /code/<name> -> browser; /code/<name>.git/... -> git clone.
    # Read-only Radicle HTTP API of our seed (release ids, repo info) under our own name.
    location ^~ /code/api/ {
        proxy_pass https://207.241.172.71/api/v1/;
        proxy_ssl_server_name on;
        proxy_ssl_name 207-241-172-71.sslip.io;
        proxy_set_header Host 207-241-172-71.sslip.io;
        limit_except GET HEAD { deny all; }
        proxy_read_timeout 30s;
    }
    location = /code  { return 302 https://radicle.network/nodes/iris.radicle.network/users/did:key:z6MkwBSv9xrstbwUwgebU2AXvqTsKAjHeZ4AnjQx1VExHKd5; }
    location = /code/ { return 302 https://radicle.network/nodes/iris.radicle.network/users/did:key:z6MkwBSv9xrstbwUwgebU2AXvqTsKAjHeZ4AnjQx1VExHKd5; }
    location ~ ^/code/(?<code_name>[a-z-]+)\.git(?<code_rest>/.*)?$ {
        if ($code_repo = "") { return 404; }
        # Proxied, not redirected: some CI importers (AppVeyor) refuse redirects/foreign hosts.
        proxy_pass https://207.241.172.71/$code_repo.git$code_rest$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name 207-241-172-71.sslip.io;
        proxy_set_header Host 207-241-172-71.sslip.io;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }
    location ~ ^/code/(?<code_name>[a-z-]+)/?$ {
        if ($code_rid = "") { return 404; }
        return 302 https://radicle.network/nodes/iris.radicle.network/$code_rid;
    }
    # Any viewer page: /code/<name>/issues, /releases, /tree/<rev>/<path>, /commits/<sha> ...
    # Links everywhere say zkas.info/code/...; viewer pages go to the public seed iris
    # (all repos replicate there); clones and the API are proxied to our own seed.
    location ~ ^/code/(?<code_name>[a-z-]+)/(?<code_rest>.+)$ {
        if ($code_rid = "") { return 404; }
        return 302 https://radicle.network/nodes/iris.radicle.network/$code_rid/$code_rest$is_args$args;
    }

