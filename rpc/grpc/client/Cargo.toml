[package]
name = "kaspa-grpc-client"
description = "Kaspa gRPC client"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kaspa-core.workspace = true
kaspa-grpc-core.workspace = true
kaspa-notify.workspace = true
kaspa-rpc-core.workspace = true
kaspa-utils.workspace = true
kaspa-utils-tower.workspace = true

async-channel.workspace = true
async-stream.workspace = true
async-trait.workspace = true
faster-hex.workspace = true
futures.workspace = true
h2.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
paste.workspace = true
prost.workspace = true
rand.workspace = true
regex.workspace = true
thiserror.workspace = true
tower = { workspace = true }
tokio-socks = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["gzip"] }
triggered.workspace = true
futures-util.workspace = true
rustls.workspace = true

[features]
heap = []

[lints]
workspace = true

# examples/tagged_devnet.rs (task C3): drives a live devnet node past the tagged-channels activation.
[dev-dependencies]
kaspa-addresses.workspace = true
kaspa-consensus-core.workspace = true
kaspa-shielded-core = { workspace = true, features = ["circuit"] }
orchard = { package = "zakura-orchard", version = "=2.2.0", default-features = false, features = ["std", "weighted-merkle", "circuit"] }
incrementalmerkletree = { version = "=0.8.2", features = ["legacy-api"] }
rand10 = { package = "rand", version = "0.10" }
