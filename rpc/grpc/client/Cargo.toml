[package]
name = "kaspa-grpc-client"
description = "Kaspa gRPC client"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kaspa-core.workspace = true
kaspa-grpc-core.workspace = true
kaspa-notify.workspace = true
kaspa-rpc-core.workspace = true
kaspa-utils.workspace = true
kaspa-utils-tower.workspace = true

async-channel.workspace = true
async-stream.workspace = true
async-trait.workspace = true
faster-hex.workspace = true
futures.workspace = true
h2.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
paste.workspace = true
prost.workspace = true
rand.workspace = true
regex.workspace = true
thiserror.workspace = true
tower = { workspace = true }
tokio-socks = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["gzip"] }
triggered.workspace = true
futures-util.workspace = true

[features]
heap = []

[lints]
workspace = true

# Not referenced by this crate's code; present so the workspace's rustls features unify.
# The iOS engine must not pull a C-compiled TLS provider (see zkas-walletd/Cargo.toml).
[target.'cfg(not(target_os = "ios"))'.dependencies]
rustls.workspace = true
