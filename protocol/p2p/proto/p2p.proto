syntax = "proto3";
package protowire;

option go_package = "github.com/kaspanet/kaspad/protowire";

message RequestAddressesMessage{
  bool includeAllSubnetworks = 1;
  SubnetworkId subnetworkId = 2;
}

message AddressesMessage{
  repeated NetAddress addressList = 1;
}

message NetAddress{
  int64 timestamp = 1;
  bytes ip = 3;
  uint32 port = 4;
}

message SubnetworkId{
  bytes bytes = 1;
}

message TransactionMessage{
  uint32 version = 1;
  repeated TransactionInput inputs = 2;
  repeated TransactionOutput outputs = 3;
  uint64 lockTime = 4;
  SubnetworkId subnetworkId = 5;
  uint64 gas = 6;
  bytes payload = 8;
  uint64 storage_mass = 9;
}

message TransactionInput{
  Outpoint previousOutpoint = 1;
  bytes signatureScript = 2;
  uint64 sequence = 3;
  uint32 compute_commit = 4;
}

message Outpoint{
  TransactionId transactionId = 1;
  uint32 index = 2;
}

message TransactionId{
  bytes bytes = 1;
}
message ScriptPublicKey {
  bytes script = 1;
  uint32 version = 2;
}

message CovenantBinding{
  uint32 authorizingInput = 1;
  Hash covenantId = 2;
}

message TransactionOutput{
  uint64 value = 1;
  ScriptPublicKey scriptPublicKey = 2;
  CovenantBinding covenant = 3;
}

message BlockMessage{
  BlockHeader header = 1;
  repeated TransactionMessage transactions = 2;
}

message BlockBodyMessage{
  repeated TransactionMessage transactions = 1;
}

message BlockHeader{
  uint32 version = 1;
  repeated BlockLevelParents parents = 12;
  Hash hashMerkleRoot = 3;
  Hash acceptedIdMerkleRoot = 4;
  Hash utxoCommitment = 5;
  int64 timestamp = 6;
  uint32 bits = 7;
  uint64 nonce = 8;
  uint64 daaScore = 9;
  bytes blueWork = 10;
  Hash pruningPoint = 14;
  uint64 blueScore = 13;
  // Optional merged-mining (AuxPoW) witness, borsh-encoded. Empty for natively-mined
  // blocks. Not covered by the header hash, so it never affects H_fc.
  bytes auxPow = 15;
}

message BlockLevelParents {
  repeated Hash parentHashes = 1;
  uint32 cumulativeLevel = 2;
}

message Hash{
  bytes bytes = 1;
}

message RequestBlockLocatorMessage{
  Hash highHash = 1;
  uint32 limit = 2;
}

message BlockLocatorMessage{
  repeated Hash hashes = 1;
}

message RequestHeadersMessage{
  Hash lowHash = 1;
  Hash highHash = 2;
}

message RequestNextHeadersMessage{
}

message DoneHeadersMessage{
}

message RequestRelayBlocksMessage{
  repeated Hash hashes = 1;
}

message RequestTransactionsMessage {
  repeated TransactionId ids = 1;
}

message TransactionNotFoundMessage{
  TransactionId id = 1;
}

message InvRelayBlockMessage{
  Hash hash = 1;
}

message InvTransactionsMessage{
  repeated TransactionId ids = 1;
}

message PingMessage{
  uint64 nonce = 1;
}

message PongMessage{
  uint64 nonce = 1;
}

message VerackMessage{
}

message VersionMessage{
  uint32 protocolVersion = 1;
  uint64 services = 2;
  int64 timestamp = 3;
  NetAddress address = 4;
  bytes id = 5;
  string userAgent = 6;
  bool disableRelayTx = 8;
  SubnetworkId subnetworkId = 9;
  string network = 10;
}

message RejectMessage{
  string reason = 1;
}

message RequestPruningPointUTXOSetMessage{
  Hash pruningPointHash = 1;
}

message PruningPointUtxoSetChunkMessage{
  repeated OutpointAndUtxoEntryPair outpointAndUtxoEntryPairs = 1;
}

message OutpointAndUtxoEntryPair{
  Outpoint outpoint = 1;
  UtxoEntry utxoEntry = 2;
}

message UtxoEntry {
  uint64 amount = 1;
  ScriptPublicKey scriptPublicKey = 2;
  uint64 blockDaaScore = 3;
  bool isCoinbase = 4;
  Hash covenantId = 5;
}

message RequestNextPruningPointUtxoSetChunkMessage {
}

message DonePruningPointUtxoSetChunksMessage {
}

message RequestIBDBlocksMessage{
  repeated Hash hashes = 1;
}

message RequestBlockBodiesMessage{
  repeated Hash hashes = 1;
}

message UnexpectedPruningPointMessage{
}

message IbdBlockLocatorMessage {
  Hash targetHash = 1;
  repeated Hash blockLocatorHashes = 2;
}

message RequestIBDChainBlockLocatorMessage{
  Hash lowHash = 1;
  Hash highHash = 2;
}

message IbdChainBlockLocatorMessage {
  repeated Hash blockLocatorHashes = 1;
}

// Legacy name of this message is `RequestAnticoneMessage`
message RequestAntipastMessage{
  Hash blockHash = 1;
  Hash contextHash = 2;
}

message IbdBlockLocatorHighestHashMessage {
  Hash highestHash = 1;
}

message IbdBlockLocatorHighestHashNotFoundMessage {
}

message BlockHeadersMessage {
  repeated BlockHeader blockHeaders = 1;
}

message RequestPruningPointAndItsAnticoneMessage {
}

message RequestNextPruningPointAndItsAnticoneBlocksMessage{
}

// TODO: remove once v4 is obsolete
message BlockWithTrustedDataMessage {
  BlockMessage block = 1;
  uint64 daaScore = 2;
  repeated DaaBlock daaWindow = 3;
  repeated BlockGhostdagDataHashPair ghostdagData = 4;
}

// TODO: rename to `TrustedBlock` once v5 is obsolete
message DaaBlock {
  BlockMessage block = 3;
  GhostdagData ghostdagData = 2;
}

// TODO: rename to `TrustedHeader` once v5 is obsolete
message DaaBlockV4 {
  BlockHeader header = 1;
  GhostdagData ghostdagData = 2;
}

// TODO: remove once v5 is obsolete
message BlockGhostdagDataHashPair {
  Hash hash = 1;
  GhostdagData ghostdagData = 2;
}

message GhostdagData {
  uint64 blueScore = 1;
  bytes blueWork = 2;
  Hash selectedParent = 3;
  repeated Hash mergeSetBlues = 4;
  repeated Hash mergeSetReds = 5;
  repeated BluesAnticoneSizes bluesAnticoneSizes = 6;
}

message BluesAnticoneSizes {
  Hash blueHash = 1;
  uint32 anticoneSize = 2;
}

message DoneBlocksWithTrustedDataMessage {
}

message PruningPointsMessage {
  repeated BlockHeader headers = 1;
}

message RequestPruningPointProofMessage {
}

message PruningPointProofMessage {
  repeated PruningPointProofHeaderArray headers = 1;
}

message PruningPointProofHeaderArray {
  repeated BlockHeader headers = 1;
}

message ReadyMessage {
}

message BlockWithTrustedDataV4Message {
  BlockMessage block = 1;
  repeated uint64 daaWindowIndices = 2; // TODO: remove once v5 is obsolete
  repeated uint64 ghostdagDataIndices = 3; // TODO: remove once v5 is obsolete
}

message TrustedDataMessage {
  repeated DaaBlockV4 daaWindow = 1; // TODO: rename to `trustedSubDag` once v5 is obsolete
  repeated BlockGhostdagDataHashPair ghostdagData = 2; // TODO: remove once v5 is obsolete
}

// SMT state sync (KIP-21 IBD)

message RequestPruningPointSmtStateMessage {
  Hash pruningPointHash = 1;
}

message SmtMetadataMessage {
  bytes data = 1;                  // 96 bytes: lanes_root || payload_and_ctx_digest || parent_seq_commit
  uint64 activeLanesCount = 2;     // number of active lanes
}

message SmtLaneEntry {
  bytes data = 1;         // 64 bytes: lane_key[32] || lane_tip[32]
  uint64 blueScore = 2;
  bytes proof = 3;        // optional: bitmap[32] || terminal_tag[1] || terminal_payload || siblings[N * 32]
}

message SmtLaneChunkMessage {
  repeated SmtLaneEntry entries = 1;   // up to SMT_CHUNK_SIZE lane entries per chunk
}

message RequestNextPruningPointSmtChunkMessage {
}

// Shielded-pool state sync (ZKas IBD, PLAN §2.8/§2.9). Transfers the shielded
// state at the pruning point so a fast-syncing node can validate the pruning
// point's descendants without replaying pre-pruning shielded history.

message RequestPruningPointShieldedStateMessage {
  Hash pruningPointHash = 1;
}

message ShieldedMetadataMessage {
  bytes data = 1;                  // bincode(frontier, supply totals, nullifier MuHash, state_root)
  uint64 nullifierCount = 2;       // number of spent nullifiers that follow in chunks
}

message ShieldedNullifierChunkMessage {
  repeated bytes nullifiers = 1;   // each 32 bytes; up to SHIELDED_CHUNK_SIZE per chunk
}

message RequestNextPruningPointShieldedChunkMessage {
}

// N1 (spec 08 R3.3/R3.4.1): one key range of the pruning-point nullifier set, [fromKey, beforeKey)
// (each 32 bytes; empty = unbounded). Sent only to peers advertising SERVICE_NF_SORTED_STREAM.
// Reply: if withMetadata, first the same ShieldedMetadataMessage as the full request
// (nullifierCount = the WHOLE set's size); then ShieldedNullifierChunkMessages with the range's
// nullifiers in ascending order; then ONE EMPTY ShieldedNullifierChunkMessage, which ends the range.
// Flow control: after every SMT_FLOW_CONTROL_WINDOW-th non-empty chunk the server waits for a
// RequestNextPruningPointShieldedChunk, and the requester always sends it at that point.
message RequestPruningPointShieldedChunkFromMessage {
  Hash pruningPointHash = 1;
  bytes fromKey = 2;
  bytes beforeKey = 3;
  bool withMetadata = 4;
}

// ---- Shielded history backfill (ZKas) ----
//
// A fresh node syncs from a headers proof and only ever writes scan records for blocks it
// validates itself, i.e. pruning point forward. The per-note archive below its pruning point is
// therefore absent, and a wallet querying such a node silently sees a partial balance. This pair
// backfills that archive AFTER IBD, without re-validating a single historical block.
//
// The stream is server-driven: the requester cannot enumerate the range itself (its own
// selected-chain index is re-based to 0 at its pruning point by `init_with_pruning_point`, so
// index spaces do not align between nodes, and its header segment stops well above genesis).
// The server walks ITS selected chain downward from the requested anchor and streams records.
//
// Trust: none required. Every record carries the `cmx` leaves; replaying them into an empty tree
// must reproduce the frontier the requester already holds at its pruning point, which is
// PoW-anchored via the pruning point's selected child coinbase commitment. A lying peer is
// detected on the final frontier comparison and its whole contribution discarded.
message RequestShieldedHistoryMessage {
  bytes anchorHash = 1;            // walk the server's selected chain DOWNWARD from this block (exclusive)
  uint32 maxBlocks = 2;            // requester's cap on blocks in this response
}

message ShieldedHistoryChunkMessage {
  repeated ShieldedHistoryEntry entries = 1;  // oldest-last (descending chain order)
  bool done = 2;                              // true when the server reached genesis
  // The anchor's own GENESIS-based index on the server. The requester needs this to align the
  // two numbering spaces: its index is re-based so ITS pruning point is 0, and the walk below
  // is EXCLUSIVE of the anchor, so the anchor block is never in `entries` and its index cannot
  // be inferred from them. Without it the ingest searched each chunk for a block the protocol
  // guarantees is absent, found nothing, and wrote nothing — silently, for every chunk.
  uint64 anchorIndex = 3;
}

message ShieldedHistoryEntry {
  bytes blockHash = 1;
  bytes data = 2;                  // bincode(ShieldedScanBlockData)
  uint64 chainIndex = 3;           // sender's GENESIS-based selected-chain index
}

message RequestNextShieldedHistoryChunkMessage {
}
