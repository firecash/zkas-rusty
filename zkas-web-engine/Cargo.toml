[package]
name = "zkas-web-engine"
version = "0.1.0"
edition = "2021"
description = "The ZKas wallet engine for a web page: scan, verify and hold a shielded wallet in the browser. The viewing key never leaves it."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kaspa-shielded-core = { workspace = true, features = ["circuit-core"] }
kaspa-shielded-wallet.workspace = true
kaspa-addresses.workspace = true
zkas-wallet-engine = { path = "../sdk/wallet-engine" }
kaspa-consensus-core.workspace = true
flate2.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
secp256k1 = { workspace = true }
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's crypto.getRandomValues, for every getrandom generation in the tree.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# Equivalence with the engine the phone and desktop run, on the real published files.
zkas-walletd = { path = "../zkas-walletd" }
kaspa-rpc-core.workspace = true
