[package]
name = "kaspa-txscript"
description = "Kaspa txscript engine library"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[[example]]
name = "kip-10"

[features]
wasm32-core = ["dep:js-sys", "dep:kaspa-wasm-core"]
wasm32-sdk = ["wasm32-core", "kaspa-consensus-core/wasm32-sdk"]

[dependencies]
ark-bn254.workspace = true
ark-ec.workspace = true
ark-groth16.workspace = true
ark-relations.workspace = true
ark-serialize.workspace = true
ark-snark.workspace = true
blake2b_simd.workspace = true
blake3.workspace = true
borsh.workspace = true
cfg-if.workspace = true
faster-hex.workspace = true
hexplay.workspace = true
indexmap.workspace = true
itertools.workspace = true
js-sys = { workspace = true, optional = true }
kaspa-addresses.workspace = true
kaspa-consensus-core.workspace = true
kaspa-hashes.workspace = true
kaspa-txscript-errors.workspace = true
kaspa-utils.workspace = true
kaspa-wasm-core = { workspace = true, optional = true }
log.workspace = true
parking_lot.workspace = true
rand.workspace = true
risc0-binfmt.workspace = true
risc0-circuit-recursion.workspace = true
risc0-core.workspace = true
risc0-zkp.workspace = true
secp256k1.workspace = true
serde-wasm-bindgen.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
workflow-wasm.workspace = true

# risc0-zkvm-platform (via the risc0 crates above) always compiles `sys_alloc_words`, which calls
# `sys_alloc_aligned`, but defines `sys_alloc_aligned` outside a zkVM guest only with
# `export-syscalls` (a stub that panics if ever called; host code never calls it). ELF and Mach-O
# linkers ignore the dangling reference; every MSVC linker rejects it ("undefined symbol:
# sys_alloc_aligned" linking kaspa-wrpc-server), so without this a Windows build of the node fails.
[target.'cfg(windows)'.dependencies]
risc0-zkvm-platform = { version = "2.2.2", features = ["export-syscalls"] }

[dev-dependencies]
bytemuck.workspace = true
criterion.workspace = true
rayon.workspace = true
kaspa-core.workspace = true
serde_json.workspace = true
smallvec.workspace = true
wasm-bindgen-test.workspace = true

[[bench]]
name = "zk_precompiles"
path = "benches/zk_precompiles.rs"
harness = false

[[bench]]
name = "pricing"
path = "benches/pricing.rs"
harness = false

[lints]
workspace = true
