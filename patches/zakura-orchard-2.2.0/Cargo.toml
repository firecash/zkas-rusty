[package]
edition = "2024"
rust-version = "1.91"
name = "zakura-orchard"
version = "2.2.0"
authors = [
    "Dev Ojha <ValarDragon@users.noreply.github.com>",
    "Sean Bowe <ewillbefull@gmail.com>",
]
build = false
exclude = ["/AGENTS.md"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The Orchard shielded transaction protocol"
readme = "README.md"
keywords = [
    "cryptography",
    "orchard",
    "zero-knowledge",
    "zcash",
]
categories = ["cryptography::cryptocurrencies"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zakura-core/common"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
    "--html-in-header",
    "katex-header.html",
]

[features]
circuit = [
    "dep:halo2_gadgets",
    "dep:halo2_proofs",
    "std",
]
circuit-fixtures = [
    "circuit",
    "halo2_proofs/unstable-circuit-fixtures",
]
default = [
    "circuit",
    "multicore",
    "std",
]
dev-graph = [
    "halo2_proofs?/dev-graph",
    "image",
    "plotters",
]
multicore = [
    "halo2_proofs?/multicore",
    "dep:maybe-rayon",
    "maybe-rayon/threads",
]
orbits = ["halo2_proofs?/orbits"]
portable = [
    "pasta_curves/portable",
    "halo2_proofs?/portable",
]
prover-fingerprint = [
    "circuit",
    "halo2_proofs/unstable-prover-fingerprint",
]
std = [
    "corez/std",
    "group/wnaf-memuse",
    "reddsa/std",
]
test-dependencies = [
    "proptest",
    "rand/std",
    "rand/std_rng",
]
unstable-frost = []
unstable-voting-circuits = ["dep:visibility"]
verifier-fingerprint = [
    "circuit",
    "halo2_proofs/unstable-verifier-fingerprint",
]
weighted-merkle = []
x86_64-asm = [
    "pasta_curves/x86_64-asm",
    "halo2_proofs?/x86_64-asm",
]

[lib]
name = "orchard"
path = "src/lib.rs"
bench = false

[[example]]
name = "generate_lagrange_coeffs"
path = "examples/generate_lagrange_coeffs.rs"
required-features = [
    "circuit",
    "unstable-voting-circuits",
]

[[test]]
name = "builder"
path = "tests/builder.rs"

[[test]]
name = "ironwood_batch_timings"
path = "tests/ironwood_batch_timings.rs"
required-features = ["circuit"]

[[test]]
name = "platform_smoke"
path = "tests/platform_smoke.rs"

[[bench]]
name = "circuit"
path = "benches/circuit.rs"
harness = false
required-features = ["circuit"]

[[bench]]
name = "ironwood_k11_prover"
path = "benches/ironwood_k11_prover.rs"
harness = false
required-features = ["circuit"]

[[bench]]
name = "merkle"
path = "benches/merkle.rs"
harness = false

[[bench]]
name = "note_decryption"
path = "benches/note_decryption.rs"
harness = false
required-features = ["circuit"]

[[bench]]
name = "post_nu6_3_k11_keygen"
path = "benches/post_nu6_3_k11_keygen.rs"
harness = false
required-features = ["circuit"]

[[bench]]
name = "small"
path = "benches/small.rs"
harness = false

