[package]
name = "zkas-walletd"
description = "ZKas local wallet daemon: a non-custodial, localhost-only REST wallet over the shielded (Orchard) pool. Wraps kaspa-shielded-core (keygen, note-scan, real Halo 2 shielded spend, message sign/verify) and drives a kaspad (ZKas) node over gRPC. Keys never leave the machine."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zkas-walletd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Pasta field arithmetic through the x86-64 MULX/ADCX/ADOX inline-asm backend that
# zakura-pasta-curves 2.2.0 ships behind `x86_64-asm` (spec 11 R1: about -16% on trial
# decryption, measured on this host). Needs BMI2 + ADX at RUN time (Broadwell / Zen or
# newer): there is no runtime dispatch, so a binary built with this on dies with SIGILL
# on an older CPU. OPT-IN, not default: kaspad links this crate behind its
# `wallet-api` feature and must not inherit an asm field backend into its consensus
# build by accident. The hosted daemon is built with `--features pasta-asm`. Cargo
# feature unification turns it on for every crate in that binary that links pasta
# (Halo 2 proving included); the verify.rs proof/VK tests must pass in the same
# invocation (`cargo test -p kaspa-shielded-core -p zkas-walletd --features pasta-asm`).
pasta-asm = ["pasta_curves/x86_64-asm"]

[dependencies]
libc = "0.2"
# Only so `pasta-asm` can name the feature; the code uses kaspa_shielded_core::pasta_curves.
pasta_curves = { package = "zakura-pasta-curves", version = "=2.2.0" }
# Address parse/format for the wallet's own shielded address + the recipient.
kaspa-addresses.workspace = true
# The version-2 shielded transaction shape + tx id.
kaspa-consensus-core.workspace = true
# Shared logger init.
kaspa-core.workspace = true
# gRPC transport to a running kaspad (ZKas) node.
kaspa-grpc-client.workspace = true
# Free memory on platforms without /proc/meminfo (Windows, macOS) for the memory gates.
# Only `System` (memory totals) is used; the other modules are not built. The network
# module in particular does not compile for iOS (routing-socket constants libc has no iOS
# definition for), and Apple forbids its calls there.
sysinfo = { version = "0.31.2", default-features = false, features = ["system"] }
kaspa-rpc-core.workspace = true
# The shielded engine: WalletDb (scan/witness/balance), the real Halo 2 payment
# builder (circuit feature), coinbase-note reconstruction, and message sign/verify.
kaspa-shielded-core = { workspace = true, features = ["circuit"] }
zkas-gpu = { path = "../zkas-gpu" }
# Canonical shielded-tx shape + its sighash context.
kaspa-shielded-wallet.workspace = true
zkas-wallet-engine.workspace = true
zkas-sdk.workspace = true

axum = "0.7"
tower-http = { version = "0.5.2", features = ["cors"] }
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread", "time", "sync", "signal"] }
# Parallel page decode: the per-block coinbase Sinsemilla commitment dominates scan CPU
# (~1 ms/block serial — the measured ~900 blk/s ceiling); blocks are independent, so the
# shared decode fans out across cores.
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
flate2.workspace = true
log.workspace = true
clap.workspace = true
# CSPRNG for fresh wallet seeds + message signing.
rand.workspace = true
rand10 = { package = "rand", version = "0.10" }
# Seed-file encryption at rest (XChaCha20-Poly1305 with an Argon2-derived key).
argon2.workspace = true
chacha20poly1305.workspace = true

# Self-hosting mode (`--serve-public` / node-embedded): auto-generate a self-signed
# TLS cert, serve HTTPS directly (no reverse proxy), and print a pairing QR so a
# mobile wallet can pin the cert. Keeps the FVK off the wire in the clear.
qrcode = { version = "0.14", default-features = false }
sha2.workspace = true
hex.workspace = true
secp256k1.workspace = true

[dev-dependencies]
# Only for the task-03 differential test (`day_diff_tests`): the reference two-NoteCommit
# coinbase derivation and planted notes. Same versions the workspace already links.
orchard = { package = "zakura-orchard", version = "=2.2.0", default-features = false, features = ["std", "weighted-merkle"] }
zcash_note_encryption = "=0.4.2"
blake2b_simd = { workspace = true }
# Stage W conformance (spec 02 §7.1 T1): walletd's uniform build under the pinned ChaCha20 RNG of
# the golden vectors (SHA-256 via the regular `sha2` dependency).
rand_chacha = "0.10"

# The TLS stack, per target. Everywhere but iOS it is rustls, whose providers (ring,
# aws-lc) compile C against the platform headers. The iOS engine is cross-built on Linux
# without an Apple SDK, so it compiles no C against Apple headers: HTTPS (chain files)
# goes through the system's Security.framework via native-tls, and the self-hosting TLS
# listener (axum-server + rcgen) is not built in — a phone serves loopback only.
[target.'cfg(not(target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls.workspace = true
rcgen = "0.13"

[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
# The App Store feature set leaves out the routing-socket network statistics Apple forbids
# on iOS (and whose libc constants do not exist for the iOS target).
sysinfo = { version = "0.31.2", default-features = false, features = ["system", "apple-app-store"] }
